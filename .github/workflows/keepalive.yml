name: Supabase Keep-Alive

# Prevents the free-tier Supabase project (Klein-Projects) from being paused
# after 7 days of inactivity. Runs a tiny read query against the database every
# 3 days, which registers as activity and resets the inactivity clock.
#
# This does NOT change any data — it only reads from one table.
#
# The project URL is public (it ships in every browser as NEXT_PUBLIC_SUPABASE_URL),
# so it is hardcoded below. The only secret required is:
#   SUPABASE_ANON_KEY = the project's anon/public key (from .env.local
#                       NEXT_PUBLIC_SUPABASE_ANON_KEY, or Supabase dashboard
#                       -> Project Settings -> API)

on:
  schedule:
    # 14:37 UTC every 3rd day. UTC only; well under the 7-day pause window.
    - cron: "37 14 */3 * *"
  workflow_dispatch: {}  # lets you run it on demand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row to register database activity
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          HTTP=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            "https://kajddojfkbewcwiigbwb.supabase.co/rest/v1/site_settings?select=*&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded with HTTP status: $HTTP"
          if [ "$HTTP" = "200" ]; then
            echo "Keep-alive ping succeeded — database activity registered."
          else
            echo "Keep-alive ping FAILED (expected 200). Check the SUPABASE_ANON_KEY secret."
            exit 1
          fi
